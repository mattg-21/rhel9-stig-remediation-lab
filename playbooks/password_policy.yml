- name: Configure password policy
  hosts: stig_targets
  become: true

  tasks:
    - name: Ensure minimum password length is set to 15
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*#?\s*minlen\s*='
        line: 'minlen = 15'
        state: present
